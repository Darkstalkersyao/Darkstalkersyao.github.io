<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>趣味测试</title>
<style>
  /* 配色对齐 Fluid 主题，支持暗色模式 */
  :root {
    --bg: #eee;
    --board: #fff;
    --text: #3c4858;
    --heading: #1a202c;
    --sec: #718096;
    --accent: #2f4154;
    --link: #0366d6;
    --line: #eaecef;
    --btn: #f6f8fa;
    --btn-hover: #f2f3f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #181c27;
      --board: #252d38;
      --text: #c4c6c9;
      --heading: #c4c6c9;
      --sec: #a7a9ad;
      --accent: #1f3144;
      --link: #1589e9;
      --line: #435266;
      --btn: #2f4154;
      --btn-hover: #46647e;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    letter-spacing: 0.02em;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 16px 64px;
    transition: background-color .2s ease-in-out, color .2s ease-in-out;
  }

  a { color: var(--link); text-decoration: none; }
  a:hover { color: #30a9de; }

  .back-home { align-self: flex-start; margin-bottom: 20px; font-size: 14px; }

  .board {
    background: var(--board);
    border-radius: 0.5rem;
    box-shadow: 0 8px 16px rgba(0, 0, 0, .15), 0 12px 40px rgba(0, 0, 0, .12);
    width: 100%;
    max-width: 640px;
    padding: 40px 36px;
    transition: background-color .2s ease-in-out;
  }

  header.page-head { text-align: center; margin-bottom: 32px; }
  header.page-head h1 {
    color: var(--heading);
    font-size: 26px;
    margin-bottom: 8px;
  }
  header.page-head p { color: var(--sec); font-size: 14px; line-height: 1.7; }

  .cards { display: flex; flex-direction: column; gap: 18px; }

  .test-card {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 22px 24px;
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--text);
    cursor: pointer;
    transition: all .2s ease-in-out;
  }
  .test-card:hover {
    border-color: var(--link);
    color: var(--heading);
    transform: translateY(-3px);
    box-shadow: 0 6px 16px rgba(0, 0, 0, .1);
  }
  .test-card .icon {
    width: 56px; height: 56px;
    flex-shrink: 0;
    border-radius: 50%;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  .test-card .icon svg { width: 28px; height: 28px; fill: #fff; }

  .test-card .body { flex: 1; min-width: 0; }
  .test-card .body h2 { font-size: 18px; color: var(--heading); margin-bottom: 6px; }
  .test-card .body p { font-size: 13px; color: var(--sec); line-height: 1.6; }

  .test-card .meta { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  .test-card .meta span {
    font-size: 12px;
    color: var(--link);
    background: var(--btn);
    border-radius: 999px;
    padding: 3px 10px;
  }

  .test-card .arrow { color: var(--sec); font-size: 20px; flex-shrink: 0; }

  footer.note {
    margin-top: 28px;
    text-align: center;
    font-size: 12px;
    color: var(--sec);
    line-height: 1.8;
  }

  @media (max-width: 480px) {
    .board { padding: 28px 20px; }
    .test-card { padding: 18px 16px; gap: 14px; }
    .test-card .icon { width: 48px; height: 48px; }
  }
</style>
</head>
<body>

<a class="back-home" href="/">← 返回博客</a>

<div class="board">
  <header class="page-head">
    <h1>趣味测试</h1>
    <p>两个轻松的小测试：一个帮你觉察近期的压力状态，<br>一个纯属娱乐的每日运势抽签。</p>
  </header>

  <div class="cards">
    <a class="test-card" href="stress/">
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </div>
      <div class="body">
        <h2>心理压力自测</h2>
        <p>基于知觉压力量表（PSS）思路改编，帮你觉察最近一个月的状态，给出对应建议。</p>
        <div class="meta"><span>10 题</span><span>约 2 分钟</span><span>结果仅自己可见</span></div>
      </div>
      <div class="arrow">›</div>
    </a>

    <a class="test-card" href="fortune/">
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M12 2l2.4 5.3 5.8.5-4.4 3.8 1.3 5.7L12 14.2l-5.1 3.1 1.3-5.7L3.8 7.8l5.8-.5L12 2zm0 15.5l1.8 2.8-1.8 4-1.8-4 1.8-2.8z"/></svg>
      </div>
      <div class="body">
        <h2>今日运势灵签</h2>
        <p>回答几个轻松的小问题，摇一摇签筒，抽取属于你今天的运势签：宜、忌、幸运色与解语。</p>
        <div class="meta"><span>5 题 · 24 题库随机抽</span><span>约 1 分钟</span><span>纯属娱乐</span></div>
      </div>
      <div class="arrow">›</div>
    </a>
  </div>

  <footer class="note">
    测试结果均由页面本地计算，不会上传任何数据。<br>
    压力自测仅供自我觉察参考，不能替代专业评估。
  </footer>
</div>

</body>
</html>
