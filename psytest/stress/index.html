<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心理压力自测</title>
<style>
  /* 配色对齐 Fluid 主题，支持暗色模式 */
  :root {
    --bg: #eee;
    --board: #fff;
    --text: #3c4858;
    --heading: #1a202c;
    --sec: #718096;
    --accent: #2f4154;
    --link: #0366d6;
    --line: #eaecef;
    --btn: #f6f8fa;
    --btn-hover: #f2f3f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #181c27;
      --board: #252d38;
      --text: #c4c6c9;
      --heading: #c4c6c9;
      --sec: #a7a9ad;
      --accent: #1f3144;
      --link: #1589e9;
      --line: #435266;
      --btn: #2f4154;
      --btn-hover: #46647e;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    letter-spacing: 0.02em;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 16px 64px;
    transition: background-color .2s ease-in-out, color .2s ease-in-out;
  }

  .back-home { align-self: flex-start; margin-bottom: 20px; font-size: 14px; }
  a { color: var(--link); text-decoration: none; }
  a:hover { color: #30a9de; }

  .board {
    background: var(--board);
    border-radius: 0.5rem;
    box-shadow: 0 8px 16px rgba(0, 0, 0, .15), 0 12px 40px rgba(0, 0, 0, .12);
    width: 100%;
    max-width: 640px;
    padding: 40px 36px;
    transition: background-color .2s ease-in-out;
  }

  .screen { display: none; animation: fadeIn .35s ease; }
  .screen.active { display: block; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---- 开始页 ---- */
  .brand { text-align: center; margin-bottom: 26px; }
  .brand .icon {
    width: 64px; height: 64px;
    margin: 0 auto 14px;
    border-radius: 50%;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  .brand .icon svg { width: 32px; height: 32px; fill: #fff; }
  .brand h1 { font-size: 24px; color: var(--heading); margin-bottom: 8px; }
  .brand p { color: var(--sec); line-height: 1.7; font-size: 14px; }

  .chips { display: flex; justify-content: center; gap: 10px; margin: 20px 0 24px; }
  .chips span {
    background: var(--btn);
    color: var(--link);
    font-size: 13px;
    padding: 5px 14px;
    border-radius: 999px;
  }

  .notice {
    background: var(--btn);
    border-left: 3px solid var(--link);
    border-radius: 6px;
    padding: 12px 16px;
    font-size: 13px;
    color: var(--sec);
    line-height: 1.7;
    margin-bottom: 26px;
  }

  /* ---- 按钮 ---- */
  .btn {
    display: block;
    width: 100%;
    border: none;
    border-radius: 6px;
    padding: 13px;
    font-size: 16px;
    letter-spacing: 0.02em;
    cursor: pointer;
    font-family: inherit;
    transition: all .2s ease-in-out;
  }
  .btn-primary { background: var(--link); color: #fff; font-weight: 600; }
  .btn-primary:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .btn-ghost {
    background: var(--btn);
    color: var(--text);
    width: auto;
    padding: 9px 20px;
    font-size: 14px;
    border: 1px solid var(--line);
  }
  .btn-ghost:hover { background: var(--btn-hover); }
  .btn-ghost:disabled { opacity: .4; cursor: not-allowed; }

  /* ---- 答题页 ---- */
  .progress-info {
    display: flex; justify-content: space-between;
    font-size: 13px; color: var(--sec); margin-bottom: 10px;
  }
  .progress-bar {
    height: 5px; background: var(--line);
    border-radius: 3px; overflow: hidden; margin-bottom: 30px;
  }
  .progress-bar .fill {
    height: 100%; width: 0;
    background: var(--link);
    border-radius: 3px;
    transition: width .3s ease;
  }
  .question { font-size: 19px; font-weight: 600; color: var(--heading); line-height: 1.6; margin-bottom: 26px; }
  .options { display: flex; flex-direction: column; gap: 11px; }
  .option {
    display: flex; align-items: center; gap: 13px;
    padding: 14px 17px;
    background: var(--btn);
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
    text-align: left;
    font-family: inherit;
    color: var(--text);
    transition: all .18s ease;
  }
  .option:hover { border-color: var(--link); background: var(--btn-hover); }
  .option.selected { border-color: var(--link); color: var(--heading); font-weight: 600; }
  .option .dot {
    width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid var(--line); flex-shrink: 0;
    position: relative; transition: border-color .18s ease;
  }
  .option.selected .dot { border-color: var(--link); }
  .option.selected .dot::after {
    content: ''; position: absolute; inset: 4px;
    border-radius: 50%; background: var(--link);
  }
  .quiz-footer { display: flex; justify-content: space-between; margin-top: 30px; }

  /* ---- 结果页 ---- */
  .result { text-align: center; }
  .score-wrap { position: relative; width: 148px; height: 148px; margin: 4px auto 20px; }
  .score-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--line); stroke-width: 9; }
  .ring {
    fill: none;
    stroke-width: 9;
    stroke-linecap: round;
    stroke-dasharray: 377;
    stroke-dashoffset: 377;
    transition: stroke-dashoffset 1s ease, stroke .3s ease;
  }
  .score-num {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .score-num .num { font-size: 36px; font-weight: 700; color: var(--heading); line-height: 1; }
  .score-num .total { font-size: 13px; color: var(--sec); margin-top: 4px; }

  .level-badge {
    display: inline-block;
    padding: 5px 16px;
    border-radius: 999px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }
  .result h2 { font-size: 21px; color: var(--heading); margin-bottom: 14px; }
  .result .desc {
    text-align: left;
    background: var(--btn);
    border-radius: 6px;
    padding: 18px 20px;
    font-size: 14.5px;
    line-height: 1.9;
    color: var(--text);
    margin-bottom: 16px;
  }
  .result .desc ul { padding-left: 20px; margin-top: 8px; }
  .result .desc li { margin-bottom: 5px; }
  .disclaimer {
    font-size: 12px;
    color: var(--sec);
    margin-top: 18px;
    line-height: 1.7;
  }
  .result-actions { display: flex; gap: 12px; justify-content: center; margin-top: 22px; }
  .result-actions .btn { width: auto; padding: 11px 24px; }

  @media (max-width: 480px) {
    .board { padding: 28px 20px; }
    .question { font-size: 17px; }
  }
</style>
</head>
<body>

<a class="back-home" href="../">← 返回测试选择</a>

<div class="board">

  <!-- 开始页 -->
  <div class="screen active" id="screen-start">
    <div class="brand">
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </div>
      <h1>心理压力自测</h1>
      <p>回想一下最近一个月的状态，<br>选择最符合你真实感受的选项。</p>
    </div>
    <div class="chips">
      <span>10 题</span><span>约 2 分钟</span><span>结果仅自己可见</span>
    </div>
    <div class="notice">
      本测试基于知觉压力量表（PSS）的思路改编，仅供自我觉察参考，
      不构成任何医学诊断。如果你长期感到明显不适，请及时寻求专业心理咨询或就医。
    </div>
    <button class="btn btn-primary" onclick="startQuiz()">开始测试</button>
  </div>

  <!-- 答题页 -->
  <div class="screen" id="screen-quiz">
    <div class="progress-info">
      <span id="progress-text">第 1 / 10 题</span>
      <span id="progress-percent">10%</span>
    </div>
    <div class="progress-bar"><div class="fill" id="progress-fill"></div></div>

    <div class="question" id="question-text"></div>
    <div class="options" id="options"></div>

    <div class="quiz-footer">
      <button class="btn btn-ghost" id="btn-prev" onclick="prevQuestion()">上一题</button>
      <button class="btn btn-ghost" id="btn-next" onclick="nextQuestion()" disabled>下一题</button>
    </div>
  </div>

  <!-- 结果页 -->
  <div class="screen" id="screen-result">
    <div class="result">
      <div class="score-wrap">
        <svg viewBox="0 0 130 130">
          <circle class="ring-bg" cx="65" cy="65" r="60"/>
          <circle class="ring" id="score-ring" cx="65" cy="65" r="60"/>
        </svg>
        <div class="score-num">
          <span class="num" id="score-num">0</span>
          <span class="total">/ 40 分</span>
        </div>
      </div>
      <div class="level-badge" id="level-badge">压力水平：较低</div>
      <h2 id="level-title"></h2>
      <div class="desc" id="level-desc"></div>
      <div class="result-actions">
        <button class="btn btn-primary" onclick="restart()">重新测试</button>
        <a class="btn btn-ghost" style="display:flex;align-items:center;" href="../">返回选择</a>
      </div>
      <p class="disclaimer">
        以上结果仅基于简易自评量表生成，不能替代专业评估。<br>
        如有需要，请咨询心理专业人士。
      </p>
    </div>
  </div>

</div>

<script>
  // ===== 测试数据：按需替换题目即可 =====
  const QUESTIONS = [
    '最近一个月，你是否经常感到事情超出了自己的控制？',
    '最近一个月，你是否经常因意外发生的事情而感到心烦？',
    '最近一个月，你是否经常感到紧张、焦虑或烦躁不安？',
    '最近一个月，你是否经常觉得困难堆积得无法克服？',
    '最近一个月，你是否经常因琐事（排队、噪音、打扰）感到恼火？',
    '最近一个月，你是否经常感到疲惫、精力不足？',
    '最近一个月，你是否经常难以集中注意力？',
    '最近一个月，你的睡眠质量如何（入睡困难、易醒、早醒）？',
    '最近一个月，你是否对工作或学习失去兴趣和动力？',
    '最近一个月，你是否经常感到孤独，或不愿与人交流？'
  ];

  const OPTIONS = [
    { label: '从不', score: 1 },
    { label: '偶尔', score: 2 },
    { label: '经常', score: 3 },
    { label: '总是', score: 4 }
  ];

  // 结果区间（总分 10~40）
  const RESULTS = [
    {
      max: 16, color: '#2e9e5b', level: '较低', title: '你的状态很平稳',
      desc: '目前你的压力水平处于较低区间，情绪状态总体平稳，具备良好的自我调节能力，能够从容应对日常的工作与生活。',
      tips: ['保持规律的作息和运动习惯', '维持现有的社交与兴趣爱好', '继续留意自己的情绪变化']
    },
    {
      max: 24, color: '#3f7d9e', level: '中等', title: '压力适中，注意调节',
      desc: '目前你的压力水平处于中等区间。适度的压力可以成为动力，但如果不加以调节，可能会逐渐累积影响状态。',
      tips: ['每天留出一段完全属于自己的放松时间', '尝试深呼吸、冥想或轻度运动释放压力', '向信任的朋友倾诉，不要独自硬扛']
    },
    {
      max: 32, color: '#c77d2e', level: '较高', title: '压力偏大，需要主动调整',
      desc: '目前你的压力水平处于较高区间，身心可能已经持续紧绷了一段时间，注意力、睡眠或情绪可能受到了影响，建议认真对待。',
      tips: ['梳理压力来源，砍掉可做可不做的负担', '优先修复睡眠，睡前远离电子屏幕', '每天进行 30 分钟以上的有氧运动', '主动寻求家人朋友的支持']
    },
    {
      max: 40, color: '#c0504d', level: '过高', title: '压力过载，请及时求助',
      desc: '目前你的压力水平处于过高区间，身心可能已经处于超负荷状态。这不是软弱的表现，而是身体在提醒你需要休息和帮助。建议尽快做出调整，必要时寻求专业支持。',
      tips: ['考虑暂停或减少当前的高强度任务', '尽快与家人、朋友或导师沟通现状', '寻求专业心理咨询（学校心理中心或正规机构）', '如出现持续失眠、情绪低落，请及时就医']
    }
  ];

  // ===== 状态与渲染 =====
  let current = 0;          // 当前题号
  let answers = [];         // 每题得分，null 表示未作答

  const $ = id => document.getElementById(id);

  function switchScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    $(id).classList.add('active');
  }

  function startQuiz() {
    current = 0;
    answers = new Array(QUESTIONS.length).fill(null);
    renderQuestion();
    switchScreen('screen-quiz');
  }

  function renderQuestion() {
    const total = QUESTIONS.length;
    $('question-text').textContent = QUESTIONS[current];

    // 进度条与计数
    $('progress-text').textContent = `第 ${current + 1} / ${total} 题`;
    const percent = Math.round((current + 1) / total * 100);
    $('progress-percent').textContent = percent + '%';
    $('progress-fill').style.width = percent + '%';

    // 选项
    $('options').innerHTML = OPTIONS.map((opt, i) => `
      <button class="option ${answers[current] === opt.score ? 'selected' : ''}"
              onclick="selectOption(${i})">
        <span class="dot"></span><span>${opt.label}</span>
      </button>`).join('');

    // 底部按钮
    $('btn-prev').disabled = current === 0;
    const isLast = current === total - 1;
    const answered = answers[current] !== null;
    const nextBtn = $('btn-next');
    nextBtn.textContent = isLast ? '查看测试结果' : '下一题';
    nextBtn.disabled = !answered;
  }

  function selectOption(i) {
    answers[current] = OPTIONS[i].score;
    renderQuestion();
    // 非最后一题：短暂高亮后自动前进
    if (current < QUESTIONS.length - 1) {
      setTimeout(() => { current++; renderQuestion(); }, 260);
    }
  }

  function nextQuestion() {
    if (answers[current] === null) return;
    if (current < QUESTIONS.length - 1) { current++; renderQuestion(); }
    else showResult();
  }

  function prevQuestion() {
    if (current > 0) { current--; renderQuestion(); }
  }

  // ===== 结果计算与展示 =====
  function showResult() {
    const total = answers.reduce((sum, s) => sum + s, 0);
    const result = RESULTS.find(r => total <= r.max);

    // 徽章与文案
    const badge = $('level-badge');
    badge.textContent = '压力水平：' + result.level;
    badge.style.background = result.color;

    $('level-title').textContent = result.title;
    $('level-desc').innerHTML = result.desc + '<br><b>建议：</b><ul>' +
      result.tips.map(t => `<li>${t}</li>`).join('') + '</ul>';

    // 分数环（周长 2πr ≈ 377）
    const ring = $('score-ring');
    ring.style.stroke = result.color;
    setTimeout(() => {
      ring.style.strokeDashoffset = 377 * (1 - total / 40);
    }, 100);

    // 数字滚动动画
    const numEl = $('score-num');
    let shown = 0;
    const timer = setInterval(() => {
      shown++;
      numEl.textContent = shown;
      if (shown >= total) clearInterval(timer);
    }, 1000 / Math.max(total, 1) * 0.8);

    switchScreen('screen-result');
  }

  function restart() {
    switchScreen('screen-start');
  }
</script>
</body>
</html>
